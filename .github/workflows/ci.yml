# pnpm run check（lint・型・単体テスト・ビルド）、E2E（全画面のデザイン検査を含む）、Firebase エミュレータでの
# ルールと Discord 連携の検査を、main への push とプルリクエストごとに流す。本番の Firebase・Discord には繋がない。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # scripts/*.ts を Node がそのまま動かす（型の取り除き）ので、ローカルと同じ版にそろえる
  NODE_VERSION: "26"

jobs:
  check:
    name: lint・型・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  e2e:
    name: E2E・デザイン検査
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # CI=true なので playwright.config.ts が本番ビルドを 4178 で立てて検査する
      - run: pnpm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  emulator:
    name: Firestore ルール・保存・Discord 連携（エミュレータ）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: npm install -g firebase-tools@15
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:rules
      - run: pnpm run test:emulator -- --discord
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            test-results/
            firestore-debug.log
          retention-days: 7
