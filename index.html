<!doctype html>
<html lang="ja" data-theme="takufu" id="app-theme">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TRPGのセッションとログを記録し、仲間やキャラクターとつなげる卓譜。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0a19'/%3E%3Ccircle cx='22' cy='24' r='7' fill='%2322d3ee'/%3E%3Ccircle cx='42' cy='24' r='7' fill='%2322d3ee'/%3E%3Ccircle cx='32' cy='44' r='7' fill='%23e2b25c'/%3E%3C/svg%3E" />
    <title>卓譜 — セッションの記録を、仲間とつなぐ</title>
  <script>
    /* 外観モード: dark / light / system(未保存時はOSに従う)。適用は main.js より先に行う */
    try {
      var mode = localStorage.getItem("takufu-theme") || "system";
      var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "takufuDark" : "takufu");
    } catch (e) {}
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
